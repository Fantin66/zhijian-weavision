name: Build macOS DMG

# 手动触发（Actions 页面 Run workflow），或推送 v* 标签时自动构建。
# 产物不签名、不公证：自用/小范围分发够用（首次打开需右键 → 打开）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    # macos-latest 为 Apple Silicon 机器，可同时产出 arm64 与 x64
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    defaults:
      run:
        # electron 工程在子目录里；package.json 的 prebuild 钩子引用了仓库中不存在的
        # scripts/build-ai-guide.cjs，所以这里不经 npm run，直接调 electron-builder。
        working-directory: weavision/desktop/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show environment
        run: |
          node -v
          npm -v
          sw_vers

      - name: Install dependencies
        run: npm ci

      - name: Build DMG (unsigned)
        env:
          # 关闭签名身份自动探测：没有 Apple 证书时也要能出包
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dmg --${{ matrix.arch }} \
            -c.directories.output=../../../dist-mac \
            -c.mac.identity=null

      - name: List output
        working-directory: .
        run: ls -lh dist-mac || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: zhijian-weavision-mac-${{ matrix.arch }}
          path: dist-mac/*.dmg
          if-no-files-found: error
