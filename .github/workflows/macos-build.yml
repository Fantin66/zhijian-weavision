name: Build macOS DMG

# 手动触发（Actions 页面 Run workflow），或推送 v* 标签时自动构建。
# 产物不签名、不公证：自用/小范围分发够用（首次打开需右键 → 打开）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 需要 write 权限才能把 dmg 挂到 Release 上
permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    # macos-latest 为 Apple Silicon 机器，可同时产出 arm64 与 x64
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    defaults:
      run:
        # electron 工程在子目录里；package.json 的 prebuild 钩子引用了仓库中不存在的
        # scripts/build-ai-guide.cjs，所以这里不经 npm run，直接调 electron-builder。
        working-directory: weavision/desktop/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show environment
        run: |
          node -v
          npm -v
          sw_vers

      - name: Install dependencies
        run: npm ci

      - name: Build DMG (unsigned)
        env:
          # 关闭签名身份自动探测：没有 Apple 证书时也要能出包
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dmg --${{ matrix.arch }} \
            -c.directories.output=../../../dist-mac \
            -c.mac.identity=null

      - name: List output
        working-directory: .
        run: ls -lh dist-mac || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: zhijian-weavision-mac-${{ matrix.arch }}
          path: dist-mac/*.dmg
          if-no-files-found: error

      # ===== 以下是"把 CI 当云 Mac"的自检：只有 arm64 产物能在 runner 上真正运行 =====
      - name: Verify app bundle
        if: matrix.arch == 'arm64'
        working-directory: .
        run: |
          set -e
          APP=$(find dist-mac -maxdepth 3 -name "*.app" -type d | head -1)
          echo "APP = $APP"
          echo "----- 顶层结构 -----"
          ls -la "$APP/Contents"
          echo "----- Info.plist 关键项 -----"
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleIdentifier|CFBundleDocumentTypes|CFBundleName|NSHighResolutionCapable|LSMinimumSystemVersion" || true
          echo "----- 文件关联详情 -----"
          plutil -extract CFBundleDocumentTypes json -o - "$APP/Contents/Info.plist" || true
          echo "----- apps 资源 -----"
          ls -la "$APP/Contents/Resources" | head -20
          echo "----- 原生模块 (classic-level) -----"
          find "$APP/Contents/Resources" -name "*.node" | head -10 || true
          echo "----- 签名状态（预期未签名）-----"
          codesign -dv "$APP" 2>&1 | head -5 || true

      - name: Launch app with debug port
        if: matrix.arch == 'arm64'
        working-directory: .
        run: |
          APP=$(find dist-mac -maxdepth 3 -name "*.app" -type d | head -1)
          BIN="$APP/Contents/MacOS/$(basename "$APP" .app)"
          echo "starting $BIN  (with CDP on 9222)"
          "$BIN" --remote-debugging-port=9222 > /tmp/app-run.log 2>&1 &
          echo $! > /tmp/app.pid
          sleep 8
          echo "----- 进程是否存活 -----"
          pgrep -fl "织见" | head -6 || echo "(未发现进程)"

      - name: Screenshot via CDP (close modal, capture main / immersive / focus)
        if: matrix.arch == 'arm64'
        working-directory: .
        run: |
          node weavision/tests/ci-mac-shot.cjs 9222 /tmp/mac-shots || echo "CDP 截图失败（不阻断构建）"
          ls -la /tmp/mac-shots || true

      # CDP 的 Page.captureScreenshot 只包含网页渲染层，拍不到原生窗口装饰（红绿灯）
      # 与系统菜单栏；这里在 app 仍处于前台时再补一张整屏截图
      - name: Full-screen capture (native traffic lights + menu bar)
        if: matrix.arch == 'arm64'
        run: |
          screencapture -x /tmp/mac-shots/screen-full.png || echo "screencapture failed"
          ls -la /tmp/mac-shots/ || true

      - name: App stdout/stderr tail
        if: matrix.arch == 'arm64'
        run: |
          echo "----- 应用输出 -----"
          tail -40 /tmp/app-run.log || true

      - name: Upload screenshots
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: mac-run-screenshots
          path: /tmp/mac-shots/*.png
          if-no-files-found: warn

      # 把 dmg 一并挂到 Release：这样用户可以直接 curl 下载，
      # 命令行下载的文件不带 com.apple.quarantine 标记，双击即可打开。
      # 注意：gh release upload 对中文文件名处理不佳（会丢掉中文部分），
      #       所以先复制成 ASCII 名再上传。
      - name: Publish dmg to Release
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in dist-mac/*.dmg; do
            [ -f "$f" ] || continue
            case "$f" in
              *arm64*) NAME="zhijian-weavision-mac-arm64.dmg" ;;
              *)       NAME="zhijian-weavision-mac-x64.dmg" ;;
            esac
            cp "$f" "/tmp/$NAME"
            echo "uploading $f  ->  $NAME"
            gh release upload v1.1.0 "/tmp/$NAME" --clobber -R "${{ github.repository }}" \
              || echo "上传失败（不阻断构建）：$f"
          done
          echo "----- Release 资产 -----"
          gh release view v1.1.0 -R "${{ github.repository }}" --json assets \
            --jq '.assets[] | .name + "   " + (.size|tostring)' || true

  # Windows 安装包也走 CI：本地打包常被文件占用卡住，且这样能自动挂到 Release
  build-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: weavision/desktop/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npx electron-builder --win nsis portable -c.directories.output=../../../dist-win

      - name: Publish to Release
        if: always()
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist-win 2>/dev/null || true
          for f in dist-win/*.exe dist-win/*.blockmap; do
            [ -f "$f" ] || continue
            echo "uploading $f"
            gh release upload v1.1.0 "$f" --clobber -R "${{ github.repository }}" \
              || echo "上传失败（不阻断构建）：$f"
          done
