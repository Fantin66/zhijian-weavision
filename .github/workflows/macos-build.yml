name: Build macOS DMG

# 手动触发（Actions 页面 Run workflow），或推送 v* 标签时自动构建。
# 产物不签名、不公证：自用/小范围分发够用（首次打开需右键 → 打开）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    # macos-latest 为 Apple Silicon 机器，可同时产出 arm64 与 x64
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    defaults:
      run:
        # electron 工程在子目录里；package.json 的 prebuild 钩子引用了仓库中不存在的
        # scripts/build-ai-guide.cjs，所以这里不经 npm run，直接调 electron-builder。
        working-directory: weavision/desktop/electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show environment
        run: |
          node -v
          npm -v
          sw_vers

      - name: Install dependencies
        run: npm ci

      - name: Build DMG (unsigned)
        env:
          # 关闭签名身份自动探测：没有 Apple 证书时也要能出包
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac dmg --${{ matrix.arch }} \
            -c.directories.output=../../../dist-mac \
            -c.mac.identity=null

      - name: List output
        working-directory: .
        run: ls -lh dist-mac || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: zhijian-weavision-mac-${{ matrix.arch }}
          path: dist-mac/*.dmg
          if-no-files-found: error

      # ===== 以下是"把 CI 当云 Mac"的自检：只有 arm64 产物能在 runner 上真正运行 =====
      - name: Verify app bundle
        if: matrix.arch == 'arm64'
        working-directory: .
        run: |
          set -e
          APP=$(find dist-mac -maxdepth 3 -name "*.app" -type d | head -1)
          echo "APP = $APP"
          echo "----- 顶层结构 -----"
          ls -la "$APP/Contents"
          echo "----- Info.plist 关键项 -----"
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleIdentifier|CFBundleDocumentTypes|CFBundleName|NSHighResolutionCapable|LSMinimumSystemVersion" || true
          echo "----- 文件关联详情 -----"
          plutil -extract CFBundleDocumentTypes json -o - "$APP/Contents/Info.plist" || true
          echo "----- apps 资源 -----"
          ls -la "$APP/Contents/Resources" | head -20
          echo "----- 原生模块 (classic-level) -----"
          find "$APP/Contents/Resources" -name "*.node" | head -10 || true
          echo "----- 签名状态（预期未签名）-----"
          codesign -dv "$APP" 2>&1 | head -5 || true

      - name: Launch app and screenshot
        if: matrix.arch == 'arm64'
        working-directory: .
        run: |
          APP=$(find dist-mac -maxdepth 3 -name "*.app" -type d | head -1)
          echo "starting $APP"
          open "$APP" || true
          sleep 12
          echo "----- 进程是否存活 -----"
          pgrep -fl "织见" || pgrep -fl Electron || echo "(未发现进程)"
          echo "----- 截图 -----"
          screencapture -x /tmp/mac-shot.png || echo "screencapture failed"
          ls -la /tmp/mac-shot.png || true
          echo "----- 系统日志里的应用报错（若有）-----"
          log show --last 30s --predicate 'process CONTAINS "织见" OR process CONTAINS "Electron"' --style compact 2>/dev/null | tail -30 || true

      - name: Upload screenshot
        if: matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: mac-run-screenshot
          path: /tmp/mac-shot.png
          if-no-files-found: warn
